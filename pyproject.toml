[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gelareto"
version = "0.1.0"
description = "Geometry-preserving representation learning with topological signals for prediction"
readme = "readme.md"
requires-python = ">=3.10"
authors = [
  { name = "Fouad Abiad" },
]
dependencies = [
  "aeon",
  "cripser",
  "dionysus",
  "gudhi",
  "ipykernel",
  "jupyter",
  "matplotlib",
  "nbstripout",
  "numba",
  "numpy",
  "opencv-python",
  "opt-einsum",
  "pandas",
  "persim",
  "polars",
  "POT",
  "psutil",
  "PyYAML",
  "ripser",
  "scikit-image",
  "scipy",
  "stochman",
  "tifffile",
  "torch==2.8.0",
  "torchcodec",
  "torchvision",
  "tqdm",
  "transformers @ git+https://github.com/huggingface/transformers.git",
  "ucimlrepo",
  "umap-learn",
  "yt-dlp",
]

# Previously considered or outdated dependencies, retained for reference:
# adjustText
# catboost
# category_encoders
# dtype_diet
# einops
# fvcore
# geomstats
# lightgbm
# metasynth
# memory-profiler
# numexpr
# pyriemann
# ray[data,train,tune,serve]
# hpbandster
# ConfigSpace
# optuna
# scikit-learn==1.4.2
# scikit-dimension
# statsmodels
# torchaudio
# torchmetrics
# torch-geometric
# torch-scatter
# torch-sparse
# torch-cluster
# torch-spline-conv
# tslearn
# pykeops
# wandb
# giotto-tda>=0.6.1
# momentfm

[project.urls]
Repository = "https://github.com/abiadf/Gelareto"

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["topo*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
